[project]
name = "personal-budget-tracker"
version = "0.1.0"
description = "A local PySide6 desktop app for personal expense and budget tracking."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "matplotlib>=3.8",
]

[project.scripts]
budget-tracker = "budget_tracker.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["budget_tracker*"]
exclude = ["tests*", "test_dbs*", "pip_tmp*"]
